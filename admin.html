<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>商品后台</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
}

.header {
  background: #fff;
  padding: 16px;
  font-size: 20px;
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #eee;
}

.list {
  padding: 12px;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.card img {
  width: 100%;
  border-radius: 10px;
  margin-top: 8px;
}

.name {
  font-size: 16px;
  font-weight: bold;
}

.desc {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
}

.delete-btn {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #ff4d4f;
  color: white;
}

.fab {
  position: fixed;
  right: 16px;
  top: 16px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #000;
  color: white;
  font-size: 28px;
  border: none;
  z-index: 20;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 30;
}

.modal-content {
  background: white;
  width: 90%;
  max-width: 420px;
  border-radius: 16px;
  padding: 16px;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
  box-sizing: border-box;
}

.save-btn {
  width: 100%;
  padding: 12px;
  margin-top: 14px;
  border: none;
  border-radius: 8px;
  background: #000;
  color: white;
}
</style>
</head>

<body>

<div class="header">商品管理</div>

<button class="fab" onclick="openModal()">+</button>

<div class="list" id="productList"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3>新增商品</h3>

    <select id="category">
      <option value="aj1">乔一</option>
      <option value="onitsuka">鬼冢虎</option>
      <option value="shell">贝壳头</option>
      <option value="airforce">空军</option>
    </select>

    <input id="name" placeholder="商品名称" />
    <textarea id="desc" placeholder="商品描述"></textarea>
    <input id="imageFile" type="file" accept="image/*" />

    <input id="token" placeholder="GitHub Token" />

    <button class="save-btn" onclick="addProduct()">保存商品</button>
    <button class="save-btn" onclick="closeModal()">取消</button>
  </div>
</div>

<script>
const owner = "jordifeng";
const repo = "bajie";
const branch = "main";

let data = {};
let sha = "";

async function loadProducts() {
  const res = await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/products.json?t=${Date.now()}`
  );

  const result = await res.json();
  sha = result.sha;

  const content = decodeURIComponent(
    escape(atob(result.content.replace(/\n/g, "")))
  );

  data = JSON.parse(content);
  renderProducts();
}

function renderProducts() {
  const container = document.getElementById("productList");
  container.innerHTML = "";

  Object.keys(data.products).forEach(category => {
    data.products[category].forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div class="name">${item.name}</div>
        <div class="desc">${item.desc || ""}</div>
        <img src="${item.image}" />
        <button class="delete-btn" onclick="deleteProduct('${category}', ${index})">
          删除
        </button>
      `;

      container.appendChild(div);
    });
  });
}

function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function deleteProduct(category, index) {
  data.products[category].splice(index, 1);
  saveToGithub();
}

function fileToBase64(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });
}

async function uploadImage(file, token) {
  const base64 = await fileToBase64(file);
  const fileName = `images/${Date.now()}-${file.name}`;

  await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/${fileName}`,
    {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "upload image",
        content: base64,
        branch
      })
    }
  );

  return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${fileName}`;
}

async function addProduct() {
  const token = document.getElementById("token").value;
  const category = document.getElementById("category").value;
  const name = document.getElementById("name").value;
  const desc = document.getElementById("desc").value;
  const file = document.getElementById("imageFile").files[0];

  let image = "";

  if (file) {
    image = await uploadImage(file, token);
  }

  const product = {
    id: "p-" + Date.now(),
    name,
    desc,
    image
  };

  if (!data.products[category]) {
    data.products[category] = [];
  }

  data.products[category].push(product);

  await saveToGithub();
  closeModal();
}

async function saveToGithub() {
  const token = document.getElementById("token").value;

  const content = btoa(
    unescape(encodeURIComponent(JSON.stringify(data, null, 2)))
  );

  await fetch(
    `https://api.github.com/repos/${owner}/${repo}/contents/products.json?t=${Date.now()}`,
    {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "update products",
        content,
        sha,
        branch
      })
    }
  );

  alert("保存成功");
  loadProducts();
}

loadProducts();
</script>

</body>
</html>
